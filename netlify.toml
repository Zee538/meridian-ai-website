[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Internal marketing research and agent skills live in this repo but must never be served publicly.
[[redirects]]
  from = "/marketing/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.agents/*"
  to = "/404.html"
  status = 404
  force = true

# The contract portal and internal ops docs deploy separately (Netlify project "meridian-agreement-sign"); never serve them from the main site.
[[redirects]]
  from = "/contracts-portal/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ops/*"
  to = "/404.html"
  status = 404
  force = true
